name: Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 配置 JDK 版本
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'

      # 配置 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 构建 Gradle 项目
      - name: Build with Gradle
        run: ./gradlew.bat clean packageDistributionForCurrentOS

      # 展示错误日志
      - name: Show error log
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== Error Log List ==="
          Get-ChildItem "build/compose/logs/packageExe" | Format-Table Mode, LastWriteTime, Length, Name
          
          Write-Host "`n=== Error Log Contents ==="
          Get-ChildItem "build/compose/logs/packageExe/*err.txt" | 
            Sort-Object LastWriteTime -Descending | 
            Select-Object -First 1 | 
            Get-Content
          
          Write-Host "`n=== Output Log Contents ==="
          Get-ChildItem "build/compose/logs/packageExe/*out.txt" | 
            Sort-Object LastWriteTime -Descending | 
            Select-Object -First 1 | 
            Get-Content
          
          Write-Host "`n=== Package Arguments ==="
          Get-Content "build/compose/tmp/packageExe.args.txt"

      # 创建 Release 并上传构建产物
      - name: Upload build artifacts for release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/compose/binaries/exe/*.exe, build/compose/binaries/msi/*.msi"
          tag: ${{ github.ref }}
          name: "Release ${{ github.ref }}"
          bodyFile: "CHANGELOG.md"
