name: Release

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的tag时触发，如 v1.0.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 配置 JDK 版本
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'

      # 构建 Gradle 项目
      - name: Build with Gradle
        run: ./gradlew package

      # 创建 Release 并上传构建产物
      - name: Upload build artifacts for release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/compose/binaries/exe/*.exe, build/compose/binaries/msi/*.msi"
          tag: ${{ github.ref }}
          name: "Release ${{ github.ref }}"
          bodyFile: "CHANGELOG.md"
